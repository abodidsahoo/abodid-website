<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>One Click Opportunity Tracker</title>
  <link rel="stylesheet" href="/popup.css">
</head>
<body>
  <main class="pop-shell">
    <header class="pop-header">
      <div class="pop-brand-wrap">
        <span class="pop-brand-dot" aria-hidden="true"></span>
        <span class="pop-brand">ONE CLICK OPPORTUNITY TRACKER</span>
      </div>
      <button id="dashboard-btn" class="icon-btn" type="button" title="Open dashboard" aria-label="Open dashboard">↗</button>
    </header>

    <section id="auth-panel" class="pane auth-pane">
      <span class="pane-kicker">ONE CLICK. EVERY OPPORTUNITY ORGANIZED.</span>
      <h1>Save opportunities in one click.</h1>
      <p>AI organizes the key details and important dates. Use the same Google account as abodid.com.</p>
      <button id="sign-in-btn" class="pop-btn" type="button">Continue with Google →</button>
    </section>

    <section id="capture-panel" class="pane hidden">
      <div class="profile-row">
        <span class="profile-copy"><strong id="profile-name"></strong><small id="profile-username"></small></span>
        <button id="logout-btn" class="text-btn" type="button">Log out</button>
      </div>

      <div class="target-card">
        <div class="target-label">CURRENT PAGE</div>
        <div id="page-title" class="target-title">Loading tab…</div>
        <div id="page-url" class="target-url">…</div>
      </div>

      <button id="save-btn" class="pop-btn" type="button">Capture & Save →</button>

      <div id="result-box" class="result-box hidden">
        <span class="result-success-badge">SAVED ✓</span>
        <div class="result-details">
          <div><span>Category</span><strong id="result-category">—</strong></div>
          <div><span>Deadline</span><strong id="result-deadline">—</strong></div>
        </div>
      </div>
    </section>

    <div id="status-msg" class="status-msg" role="status"></div>
  </main>
  <script type="module" src="/src/popup.ts"></script>
</body>
</html>
