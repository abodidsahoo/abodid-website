<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Save Opportunity</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="pop-shell">
    <header class="pop-header">
      <div class="pop-brand-wrap">
        <span class="pop-brand-dot"></span>
        <span class="pop-brand">OPPORTUNITY RADAR</span>
      </div>
      <button id="settings-toggle" class="icon-btn" title="Settings" aria-label="Settings">⚙️</button>
    </header>

    <!-- Settings Pane (hidden by default) -->
    <div id="settings-pane" class="pane hidden">
      <div class="pane-header">Connection Settings</div>
      <label class="pop-label" for="api-url">Backend URL</label>
      <input type="url" id="api-url" class="pop-input" placeholder="https://abodid.com" value="https://abodid.com">
      
      <label class="pop-label" for="api-key">Curator Passcode</label>
      <input type="password" id="api-key" class="pop-input" placeholder="Enter passcode...">

      <button id="save-settings" class="pop-btn btn-sm">Save Config</button>
      <div id="settings-msg" class="msg-note"></div>
    </div>

    <!-- Main Capture Pane -->
    <div id="main-pane" class="pane">
      <div id="target-info" class="target-card">
        <div id="page-title" class="target-title">Loading tab...</div>
        <div id="page-url" class="target-url">...</div>
      </div>

      <button id="save-btn" class="pop-btn btn-primary">
        ⚡ Capture & Save
      </button>

      <!-- Results Display -->
      <div id="result-box" class="result-box hidden">
        <div class="result-header">
          <span class="result-success-badge">✓ Captured & Saved</span>
        </div>
        
        <div class="result-details">
          <div class="result-item">
            <span class="result-item-label">Category</span>
            <span id="result-category" class="result-category-tag">-</span>
          </div>

          <div class="result-item">
            <span class="result-item-label">Deadline</span>
            <div id="result-deadline" class="result-deadline-val">-</div>
          </div>
        </div>

        <a id="view-dashboard-link" href="https://abodid.com/opportunities" target="_blank" class="result-view-link">
          Open Dashboard ↗
        </a>
      </div>

      <div id="status-msg" class="status-msg hidden"></div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
