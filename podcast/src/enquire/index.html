<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Book or Enquire | Podcast / Abodid</title><meta name="description" content="Tell Podcast / Abodid what you want to record and request dates for a session, day or weekend."><link rel="stylesheet" href="/assets/styles.css"><script type="module" src="/assets/app.js"></script></head><body><a class="skip-link" href="#main">Skip to content</a><studio-header></studio-header><main id="main" class="form-shell">
<section class="form-intro"><p class="eyebrow">Book · Plan · Apply</p><h1>What are you trying to finish?</h1><p>Share the shape of the work. We will confirm availability, accommodation and support before payment.</p><ul class="clean-list"><li>Short session → date request</li><li>Day / weekend → project plan</li><li>Artist access → short application</li></ul></section>
<form class="enquiry-form" data-mail-form><div class="fields">
<div class="field"><label for="project">Project</label><select id="project" name="project" required><option value="">Choose one</option><option value="audiobook">Audiobook / voice</option><option value="series">Podcast series</option><option value="course">Course / founder content</option><option value="post-production">Post-production</option><option value="artist">Artist project</option><option value="other">Other</option></select></div>
<div class="field"><label for="offer">Booking format</label><select id="offer" name="offer" required><option value="">Choose one</option><option value="focused">Focused session · £120/hr</option><option value="multi">Multi-camera · £180/hr</option><option value="day">Recording day · £300</option><option value="weekend">Recording weekend · £500</option><option value="post">Post-production quote</option><option value="artist">Artist access</option></select></div>
<div class="field"><label for="date">Preferred date</label><input id="date" name="preferred date" type="date" required></div>
<div class="field"><label for="backup">Backup date</label><input id="backup" name="backup date" type="date"></div>
<div class="field"><label for="people">People recording</label><input id="people" name="number of people" type="number" min="1" max="12" value="1"></div>
<div class="field"><label for="format">Capture</label><select id="format" name="capture"><option>Audio only</option><option>Audio + video</option><option>Not sure yet</option></select></div>
<div class="field"><label for="support">Technical support</label><select id="support" name="technical support"><option>None</option><option>£90 technical setup</option><option>Ongoing support from £30/hr</option><option>Higher-complexity operator</option></select></div>
<div class="field"><label for="stay">Accommodation</label><select id="stay" name="accommodation"><option>Not needed</option><option>1–2 people</option><option>3–4 people</option></select></div>
<div class="field"><label for="name">Name</label><input id="name" name="name" autocomplete="name" required></div>
<div class="field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required></div>
<div class="field field-wide"><label for="brief">Project note</label><textarea id="brief" name="project note" placeholder="Material length, episode count, deadline, post-production needs or what subsidised access would make possible."></textarea></div>
</div><label class="check"><input type="checkbox" name="policy acknowledged" value="yes" required><span>I understand that dates, accommodation and technical support are confirmed before payment, and I agree to the studio care policy.</span></label><div class="form-actions"><button class="button" type="submit">Prepare enquiry</button><p class="form-status" role="status" aria-live="polite"></p></div><noscript><p>Email <a href="mailto:hello@abodid.com">hello@abodid.com</a> with your project, preferred date and booking format.</p></noscript></form>
</main><studio-footer></studio-footer></body></html>
