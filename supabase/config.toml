project_id = "personal-site"

[functions.moodboard-search-publisher]
# Authenticates a one-use private database dispatch token before reading/uploading.
verify_jwt = false

[functions.daily-reading-digest]
# The function authenticates either the Vault-backed x-cron-secret or an
# authenticated Supabase admin. This permits pg_net Cron calls without placing
# a service-role JWT in the request.
verify_jwt = false

[functions.sync-obsidian-vault]
# GitHub Actions authenticates with the dedicated VAULT_SYNC_SECRET. The
# service-role key remains inside Supabase and is never shared with GitHub.
verify_jwt = false

[functions.instagram-publisher]
# The gateway verifies a Supabase JWT first. The function then requires either
# an authenticated admin or the private Vault-backed token used by pg_cron.
verify_jwt = true
